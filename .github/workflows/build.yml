name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to rebuild and publish (leave empty for build only)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: python3 scripts/localization.py --check
      - run: python3 scripts/prepare-core.py
      - run: go test -race -tags cli ./...
      - run: go test -tags cli app/backend
      - run: go vet -tags cli ./...
      - name: C ABI smoke
        run: |
          go build -tags cli -buildmode=c-archive -o .build/libgotohp.a ./cmd/bridge
          cc -I.build tests/bridge_smoke.c .build/libgotohp.a -lpthread -ldl -lm -o .build/bridge-smoke
          .build/bridge-smoke
  package:
    runs-on: macos-15
    permissions:
      contents: write # tagged builds upload straight to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, rootful]
    env:
      THEOS: ${{ github.workspace }}/.theos-sdk
      RELEASE_TAG: ${{ (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v') && inputs.release_tag) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Install Theos and tools
        run: |
          brew install ldid dpkg
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git -C "$THEOS" submodule update --init --recursive
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          version=$(xcrun --sdk iphoneos --show-sdk-version)
          mkdir -p "$THEOS/sdks"
          ln -s "$sdk" "$THEOS/sdks/iPhoneOS${version}.sdk"
      - name: Mach reply-port transport
        if: matrix.scheme == 'rootless'
        run: |
          mkdir -p .build
          clang -fobjc-arc -framework Foundation tests/mach_transport.m -o .build/mach-transport-test
          .build/mach-transport-test
          clang -fobjc-arc -framework Foundation tests/ipc_client.m -o .build/ipc-client-test
          .build/ipc-client-test
          clang -fobjc-arc -framework Foundation tests/sandbox_access.m -o .build/sandbox-access-test
          .build/sandbox-access-test
          clang -fobjc-arc -framework Foundation '-DTHEOS_PACKAGE_INSTALL_PREFIX="/var/jb"' tests/sandbox_access.m -o .build/sandbox-access-rootless-test
          .build/sandbox-access-rootless-test
          clang -fblocks tests/discovery.c -o .build/discovery-test
          .build/discovery-test
          clang -fblocks Shared/GSDiscovery.c Daemon/GSDiscoveryService.c tests/discovery_launchd.c -o .build/discovery-launchd-test
          python3 scripts/test-discovery-launchd.py .build/discovery-launchd-test
          clang -fobjc-arc -framework Foundation -framework CoreFoundation tests/daemon_runloop.m -o .build/daemon-runloop-test
          .build/daemon-runloop-test
      - name: Jailbreak native account relay
        if: matrix.scheme == 'rootless'
        run: |
          clang -fobjc-arc -DGS_TEST_DAEMON_RELAY=1 -DGS_TEST_AUTOCONNECT=1 -framework Foundation UI/GSNativeAccount.m UI/GSNativeRelay.m UI/GSAccountConnection.m tests/native_account.m -o .build/native-relay-test
          .build/native-relay-test
          clang -fobjc-arc -DGS_TEST_DAEMON_RELAY=1 -DGS_TEST_AUTOCONNECT=1 -DGS_TEST_LEGACY=1 -framework Foundation UI/GSNativeAccount.m UI/GSNativeRelay.m UI/GSAccountConnection.m tests/native_account.m -o .build/native-relay-legacy-test
          .build/native-relay-legacy-test
          clang -fobjc-arc -DGS_JAILED=1 -DGS_TEST_AUTOCONNECT=1 -framework Foundation UI/GSNativeAccount.m UI/GSAccountConnection.m tests/native_account.m -o .build/native-autoconnect-jailed-test
          .build/native-autoconnect-jailed-test
          clang -fobjc-arc -DGS_JAILED=1 -DGS_TEST_AUTOCONNECT=1 -DGS_TEST_LEGACY=1 -framework Foundation UI/GSNativeAccount.m UI/GSAccountConnection.m tests/native_account.m -o .build/native-autoconnect-jailed-legacy-test
          .build/native-autoconnect-jailed-legacy-test
      - name: Jailbreak backup routing and shared completion monitor
        if: matrix.scheme == 'rootless'
        run: |
          clang -fobjc-arc -framework Foundation -Itests/native-shims UI/GSNativeAccount.m UI/GSNativeRouting.m UI/GSBackupRequests.m tests/backup_requests.m -o .build/daemon-backup-test
          .build/daemon-backup-test
          clang -fobjc-arc -DGS_TEST_LEGACY=1 -framework Foundation -Itests/native-shims UI/GSNativeAccount.m UI/GSNativeRouting.m UI/GSBackupRequests.m tests/backup_requests.m -o .build/daemon-backup-legacy-test
          .build/daemon-backup-legacy-test
          clang -fobjc-arc -framework Foundation -Itests/native-shims UI/GSNativeAccount.m UI/GSUploadMonitor.m UI/GSPhotosIntegration.m tests/upload_monitor.m -o .build/upload-monitor-test
          .build/upload-monitor-test
      - name: Build Go archive and Debian package
        run: bash scripts/package.sh '${{ matrix.scheme }}'
      - name: Verify package layout
        run: python3 scripts/verify-package.py '${{ matrix.scheme }}'
      - name: Upload package to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp packages/*.deb "gotohp-tweak-${{ matrix.scheme }}.deb"
          files=("gotohp-tweak-${{ matrix.scheme }}.deb")
          # Upload straight to the Release instead of Actions artifacts. A Release created here
          # is a prerelease carrying the gunshot-ci:pending marker; the release job publishes it
          # after every job has passed. An existing Release keeps its notes and state.
          for f in "${files[@]}"; do test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }; done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # The other build job may create it at the same moment. A tag can only have one
            # published release, so the losing create fails and the view below confirms it exists.
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG" \
              --notes "Building... <!-- gunshot-ci:pending -->" || true
            gh release view "$RELEASE_TAG" >/dev/null
          fi
          ok=0
          for i in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "${files[@]}" --clobber; then ok=1; break; fi
            echo "upload failed, retry $i"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::release upload failed"; exit 1; }
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name'
      # Non-release builds keep a short-lived copy for testing. Account-wide artifact
      # storage can run out; that must not fail the build.
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        continue-on-error: true
        with:
          retention-days: 1
          name: gotohp-tweak-${{ matrix.scheme }}
          path: |
            packages/*.deb
            packages/jailed/*.deb
            packages/jailed/*.dylib
            packages/jailed/ThirdPartyNotices.txt
          if-no-files-found: error
  jailed-test:
    name: jailed tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Sideload SSO compatibility
        run: |
          mkdir -p .build
          clang -fobjc-arc -framework Foundation -framework Security -framework LocalAuthentication tests/sideload_keychain.m -o .build/sideload-keychain-test
          .build/sideload-keychain-test
          for mode in native-private wrong-host livecontainer missing-configuration missing-helper configuration-abi helper-abi; do
            .build/sideload-keychain-test "$mode"
          done
          clang -fobjc-arc -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation tests/sideload_identity.m -o .build/sideload-identity-test
          for mode in modern legacy future wrong-host livecontainer original-id missing-id empty-id missing-configuration configuration-abi client-abi service-abi; do
            .build/sideload-identity-test "$mode"
          done
      - name: Native routing contract
        run: |
          mkdir -p .build
          clang -fobjc-arc -framework Foundation tests/localization.m -o .build/localization-test
          .build/localization-test
          clang -fobjc-arc -c UI/GSUnlimitedStorage.m -o .build/unlimited-storage.o
          clang -fobjc-arc -c tests/unlimited_storage.m -o .build/unlimited-storage-fixture.o
          swiftc -parse-as-library -emit-object -import-objc-header tests/unlimited_storage_fixture.h tests/unlimited_storage.swift -o .build/unlimited-storage-swift.o
          swiftc .build/unlimited-storage.o .build/unlimited-storage-fixture.o .build/unlimited-storage-swift.o -o .build/unlimited-storage-test
          .build/unlimited-storage-test
          .build/unlimited-storage-test incompatible-abi
          .build/unlimited-storage-test bento-only
          clang -fobjc-arc -framework Foundation -Itests/native-shims UI/GSNativeRouting.m tests/native_routing.m -o .build/native-routing-test
          .build/native-routing-test
          clang -fobjc-arc -DGS_JAILED=1 -framework Foundation -Itests/native-shims UI/GSNativeRouting.m tests/native_routing.m -o .build/silent-jailed-routing-test
          .build/silent-jailed-routing-test
          clang -fobjc-arc -DGS_JAILED=1 -framework Foundation -Itests/native-shims UI/GSNativeAccount.m UI/GSNativeRouting.m UI/GSBackupRequests.m tests/backup_requests.m -o .build/backup-requests-test
          .build/backup-requests-test
          clang -fobjc-arc -framework Foundation -Itests/native-shims UI/GSPhotosIntegration.m tests/photos_integration.m -o .build/photos-integration-test
          .build/photos-integration-test
          clang -fobjc-arc -framework Foundation UI/GSUploadDiagnostics.m tests/upload_diagnostics.m -o .build/upload-diagnostics-test
          .build/upload-diagnostics-test
          clang -fobjc-arc -framework Foundation UI/GSNativeAccount.m tests/native_account.m -o .build/native-account-test
          .build/native-account-test
          clang -fobjc-arc -framework Foundation -Itests/menu-shims -Itests/native-shims UI/GSAccountMenu.m tests/account_menu.m -o .build/account-menu-test
          .build/account-menu-test
      - name: Google Photos 7.20.2 native contracts
        run: |
          clang -fobjc-arc -framework Foundation UI/GSUnlimitedStorage.m tests/unlimited_storage_legacy.m -o .build/unlimited-storage-legacy-test
          .build/unlimited-storage-legacy-test
          .build/unlimited-storage-legacy-test missing-resources
          clang -fobjc-arc -DGS_TEST_LEGACY=1 -framework Foundation -Itests/native-shims UI/GSNativeRouting.m tests/native_routing.m -o .build/native-routing-legacy-test
          .build/native-routing-legacy-test
          clang -fobjc-arc -DGS_TEST_LEGACY=1 -DGS_JAILED=1 -framework Foundation -Itests/native-shims UI/GSNativeRouting.m tests/native_routing.m -o .build/silent-jailed-routing-legacy-test
          .build/silent-jailed-routing-legacy-test
          clang -fobjc-arc -DGS_TEST_LEGACY=1 -DGS_JAILED=1 -framework Foundation -Itests/native-shims UI/GSNativeAccount.m UI/GSNativeRouting.m UI/GSBackupRequests.m tests/backup_requests.m -o .build/backup-requests-legacy-test
          .build/backup-requests-legacy-test
          clang -fobjc-arc -DGS_TEST_LEGACY=1 -framework Foundation -Itests/native-shims UI/GSPhotosIntegration.m tests/photos_integration.m -o .build/photos-integration-legacy-test
          .build/photos-integration-legacy-test
          clang -fobjc-arc -DGS_TEST_LEGACY=1 -framework Foundation UI/GSUploadDiagnostics.m tests/upload_diagnostics.m -o .build/upload-diagnostics-legacy-test
          .build/upload-diagnostics-legacy-test
          clang -fobjc-arc -DGS_TEST_LEGACY=1 -framework Foundation UI/GSNativeAccount.m tests/native_account.m -o .build/native-account-legacy-test
          .build/native-account-legacy-test
          clang -fobjc-arc -DGS_TEST_LEGACY=1 -framework Foundation -Itests/menu-shims -Itests/native-shims UI/GSAccountMenu.m tests/account_menu.m -o .build/account-menu-legacy-test
          .build/account-menu-legacy-test
      - name: API detection independent of host version
        run: |
          clang -fobjc-arc -framework Foundation tests/photos_compatibility.m -o .build/photos-compatibility-test
          .build/photos-compatibility-test
          for version in 7.20.1 7.50.0 7.93.0 8.0.0 unknown; do
            export GS_TEST_PHOTOS_VERSION="$version"
            .build/unlimited-storage-test
            .build/unlimited-storage-test incompatible-abi
            .build/unlimited-storage-test bento-only
            .build/native-routing-test
            .build/silent-jailed-routing-test
            .build/backup-requests-test
            .build/photos-integration-test
            .build/upload-diagnostics-test
            .build/native-account-test
            .build/account-menu-test
            .build/backup-requests-legacy-test
            .build/photos-integration-legacy-test
            .build/native-account-legacy-test
          done
      - name: Bulk photo import
        run: |
          clang -fobjc-arc -framework Foundation -Itests/native-shims UI/GSBatchImport.m tests/batch_import.m -o .build/batch-import-test
          .build/batch-import-test
          clang -fobjc-arc -framework Foundation -Itests/native-shims UI/GSBatchImport.m UI/GSExporter.m tests/exporter_batch.m -o .build/exporter-batch-test
          .build/exporter-batch-test
      - name: UIKit settings presentation smoke
        timeout-minutes: 8
        run: bash scripts/test-settings-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 1
          name: settings-ui-smoke
          path: .build/settings-ui-results/
          if-no-files-found: warn
  jailed-build:
    name: package (jailed)
    runs-on: macos-15
    permissions:
      contents: write # tagged builds upload straight to the GitHub Release
    env:
      THEOS: ${{ github.workspace }}/.theos-sdk
      RELEASE_TAG: ${{ (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v') && inputs.release_tag) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Install Theos and tools
        run: |
          brew install ldid dpkg
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git -C "$THEOS" submodule update --init --recursive
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          version=$(xcrun --sdk iphoneos --show-sdk-version)
          mkdir -p "$THEOS/sdks"
          ln -s "$sdk" "$THEOS/sdks/iPhoneOS${version}.sdk"
      - name: Build Go archive and Debian package
        run: bash scripts/package.sh jailed
      - name: Verify package layout
        run: python3 scripts/verify-package.py jailed
      - name: Upload jailed package to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp packages/jailed/*.deb gotohp-tweak-jailed.deb
          cp packages/jailed/GunshotJailed.dylib GunshotJailed.dylib
          cp packages/jailed/ThirdPartyNotices.txt ThirdPartyNotices.txt
          files=(gotohp-tweak-jailed.deb GunshotJailed.dylib ThirdPartyNotices.txt)
          # Upload straight to the Release instead of Actions artifacts. A Release created here
          # is a prerelease carrying the gunshot-ci:pending marker; the release job publishes it
          # after every job has passed. An existing Release keeps its notes and state.
          for f in "${files[@]}"; do test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }; done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # The other build job may create it at the same moment. A tag can only have one
            # published release, so the losing create fails and the view below confirms it exists.
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG" \
              --notes "Building... <!-- gunshot-ci:pending -->" || true
            gh release view "$RELEASE_TAG" >/dev/null
          fi
          ok=0
          for i in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "${files[@]}" --clobber; then ok=1; break; fi
            echo "upload failed, retry $i"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::release upload failed"; exit 1; }
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name'
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        continue-on-error: true
        with:
          retention-days: 1
          name: gotohp-tweak-jailed
          path: |
            packages/jailed/*.deb
            packages/jailed/*.dylib
            packages/jailed/ThirdPartyNotices.txt
          if-no-files-found: error
  release:
    # Build jobs upload their files straight to the Release (no Actions artifacts, so a full
    # artifact quota cannot block a release). A Release created by this run starts as a
    # prerelease; once every job has passed, this job checks the asset set and publishes it.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [core, package, jailed-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected="GunshotJailed.dylib ThirdPartyNotices.txt gotohp-tweak-jailed.deb gotohp-tweak-rootful.deb gotohp-tweak-rootless.deb"
          actual=$(gh release view "$RELEASE_TAG" --json assets -q '[.assets[].name] | sort | join(" ")')
          echo "assets: $actual"
          for f in $expected; do
            case " $actual " in *" $f "*) ;; *) echo "::error::missing release asset $f"; exit 1 ;; esac
          done
          marker=$(gh release view "$RELEASE_TAG" --json body -q '.body' | grep -c 'gunshot-ci:pending' || true)
          if [ "$marker" != 0 ]; then
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" -q .body > notes.md
            case "$RELEASE_TAG" in
              *-*) gh release edit "$RELEASE_TAG" --notes-file notes.md --prerelease ;;
              *) gh release edit "$RELEASE_TAG" --notes-file notes.md --prerelease=false --latest ;;
            esac
          fi
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,isDraft,url
